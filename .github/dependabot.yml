version: 2
updates:
  # bun, not npm: the lockfile is bun.lock, which the npm updater can't refresh.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
  # Keeps the commit-SHA pins in .github/workflows current (and their version comments).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
